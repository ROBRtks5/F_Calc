name: Android Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Build Next.js & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} ./release-output/FC-MOEX-Calculator.apk \;
          ls -la ./release-output

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FC-MOEX-Calculator-APK
          path: release-output/FC-MOEX-Calculator.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ github.run_number }}
          name: FC MOEX Android Release v${{ github.run_number }}
          body: |
            Automated APK build from commit ${{ github.sha }}.
            - FC MOEX Calculator
            - Built with Capacitor 8 & Android SDK 35 (Java 21)
          files: release-output/FC-MOEX-Calculator.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
